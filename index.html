height:2px}.barcol:last-child .bar{background:var(--green)}.barcol small{font-size:9px;color:#6f8078}.chartlabels{display:flex;justify-content:space-around;padding:10px 36px 20px;font-size:10px;color:var(--muted)}.lowrow{display:flex;align-items:center;gap:11px;padding:12px 22px;border-top:1px solid #f2f4f6}.producticon{width:35px;height:35px;border-radius:8px;background:#f3eee5;display:grid;place-items:center;font-size:19px;flex-shrink:0}.lowrow .name{flex:1;font-size:12px;font-weight:600}.sub{display:block;font-size:10px;color:var(--muted);font-weight:400}.badge{display:inline-block;border-radius:5px;padding:4px 8px;font-size:10px;background:#eaf4ee;color:var(--green);white-space:nowrap}.badge.warn{background:#fff3e2;color:#ac752c}.badge.credit{background:#eef0fc;color:#7276b5}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;white-space:nowrap;text-align:left}th{font-size:10px;text-transform:uppercase;letter-spacing:.7px;font-weight:600;color:#88929c;background:#fafbfc;padding:12px 22px}td{padding:15px 22px;border-top:1px solid #f0f2f5;font-size:12px}td strong{font-weight:600}.empty{padding:35px;color:var(--muted);text-align:center}.toolbar{display:flex;gap:10px;padding:0 22px 20px}input,select{width:100%;padding:10px 12px;border:1px solid #dce2e4;border-radius:6px;background:white;color:var(--ink)}.toolbar input{max-width:350px}.toolbar select{max-width:180px}footer{font-size:10px;color:#98a1aa;display:flex;justify-content:space-between;margin-top:26px}dialog{border:0;padding:0;border-radius:12px;width:550px;max-width:94vw;max-height:90vh;color:var(--ink);box-shadow:0 20px 90px #132c2c40}dialog::backdrop{background:#10272480;backdrop-filter:blur(3px)}.modalhead{display:flex;justify-content:space-between;align-items:center;padding:23px 25px;border-bottom:1px solid var(--line)}.modalhead h2{margin:0;font-size:20px}.close{border:0;background:none;font-size:24px;color:var(--muted)}form{padding:22px 25px}label{display:block;font-size:12px;font-weight:600;margin-bottom:15px}label input,label select{margin-top:6px}.row{display:flex;gap:14px}.row>*{flex:1;min-width:0}.total{background:#edf4ef;padding:17px;border-radius:7px;display:flex;justify-content:space-between;margin:15px 0}.hint{font-size:11px;color:var(--muted);margin:5px 0 16px}.error{color:#b44338;font-size:12px;margin:10px 0}#toast{position:fixed;bottom:28px;right:28px;background:#183f34;color:white;padding:14px 22px;border-radius:8px;box-shadow:0 5px 30px #0002;display:none;z-index:10}.reportstats{margin-top:20px}@media(max-width:1000px){.sidebar{width:185px}.main{margin-left:185px;width:calc(100% - 185px)}main{padding:25px 20px}header{padding:0 20px}.grid{grid-template-columns:1fr}.stats{grid-template-columns:repeat(2,1fr)}.heading{align-items:start}.actions{flex-wrap:wrap}}@media(max-width:620px){.sidebar{position:static;width:100%;padding:15px}.app{display:block}.brand{font-size:20px}.shop,.navlabel,.sidebottom{display:none}.nav{display:flex;overflow:auto;margin-top:12px}.nav button{width:auto;white-space:nowrap;padding:8px 10px;font-size:12px}.nav i{display:none}.main{margin:0;width:100%}header{height:55px}.headerRight{gap:8px}.headerRight .date{display:none}main{padding:20px 14px}.heading{display:block}.actions{margin-top:15px}h1{font-size:24px}.stats{gap:9px}.stat{padding:14px}.value{font-size:22px}.welcome{padding:17px}.welcome .graphic{display:none}td,th{padding:12px 15px}.row{flex-wrap:wrap}.toolbar{flex-wrap:wrap}}

[hidden]{display:none!important}</style></head><body><div class="app"><aside class="sidebar"><div class="brand">▦ stockroom<span>.</span></div><div class="shop">Al-Madina Wholesale<small>Grocery & confectionery</small></div><div class="navlabel">WORKSPACE</div><nav class="nav" id="nav"></nav><div class="sidebottom"><strong>Made for your everyday.</strong>One place for stock, sales & dues.<br><br><span class="demo">INTERACTIVE DEMO</span></div></aside><div class="main"><header><div class="crumb">Workspace <span style="margin:0 10px">/</span> <b id="crumb">Overview</b></div><div class="headerRight"><span class="demo">DEMO MODE</span><span class="date" id="date"></span><span class="avatar">AM</span></div></header><main id="content"></main></div></div><dialog id="modal"></dialog><div id="toast" role="status"></div>
<script>
'use strict';
const KEY='stockroom-demo-v1',money=n=>'Rs '+Number(n).toLocaleString('en-PK',{maximumFractionDigits:0}),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),day=(offset=0)=>{let d=new Date();d.setDate(d.getDate()+offset);return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`};
function seed(){return {products:[{id:1,name:'LU Prince Biscuits',category:'Biscuits',unit:'carton',stock:42,min:10,cost:1080,price:1200,icon:'🍪'},{id:2,name:'Coca-Cola 1.5L',category:'Drinks',unit:'case',stock:8,min:12,cost:1680,price:1860,icon:'🥤'},{id:3,name:'CandyLand Eclairs',category:'Confectionery',unit:'jar',stock:6,min:10,cost:420,price:480,icon:'🍬'},{id:4,name:'Peek Freans Sooper',category:'Biscuits',unit:'carton',stock:35,min:10,cost:980,price:1100,icon:'🍪'},{id:5,name:'Pepsi 500ml',category:'Drinks',unit:'case',stock:24,min:8,cost:1100,price:1260,icon:'🥤'},{id:6,name:'Tapal Danedar 950g',category:'Grocery',unit:'pack',stock:5,min:8,cost:1650,price:1800,icon:'☕'},{id:7,name:'National Salt 800g',category:'Grocery',unit:'carton',stock:18,min:5,cost:540,price:620,icon:'📦'},{id:8,name:'Super Kernel Rice 25kg',category:'Grocery',unit:'bag',stock:15,min:5,cost:6100,price:6500,icon:'🌾'}],sales:[{id:'INV-1003',date:day(),customer:'Ahmed General Store',product:'LU Prince Biscuits',qty:5,unit:'carton',total:6000,cost:5400,paid:6000},{id:'INV-1002',date:day(),customer:'Bismillah Mart',product:'Pepsi 500ml',qty:8,unit:'case',total:10080,cost:8800,paid:5080},{id:'INV-1001',date:day(-1),customer:'Usman Kiryana',product:'Super Kernel Rice 25kg',qty:2,unit:'bag',total:13000,cost:12200,paid:10000}],purchases:[{id:'PUR-1001',date:day(-1),supplier:'United Distributors',product:'Peek Freans Sooper',qty:20,unit:'carton',total:19600}],payments:[],history:[12400,18600,14200,23100,17600]};}
let data;try{data=JSON.parse(localStorage.getItem(KEY))||seed()}catch{data=seed()}let page='Overview',filter='',category='All categories';
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(data));
    return true;
  } catch {
    return false;
  }
}
function saveMessage(saved, message) {
  toast(saved ? message : 'Changes are only in memory: browser storage failed. Keep this page open.');
}
function toast(s){let el=document.getElementById('toast');el.textContent=s;el.style.display='block';clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>el.style.display='none',4500)}
const navs=[['Overview','▦'],['Inventory','▤'],['Sales','↗'],['Purchases','↙'],['Customers','♧'],['Reports','◴']];
function go(p){page=p;filter='';category='All categories';render()}
function debts(){let result={};for(let s of data.sales){result[s.customer]=(result[s.customer]||0)+s.total-s.paid}for(let p of data.payments)result[p.customer]=(result[p.customer]||0)-p.amount;return result}
const sum=(arr,k)=>arr.reduce((a,b)=>a+b[k],0);
function stat(label,value,note,icon='↗'){return `<div class="stat"><div class="statlabel">${label}<span>${icon}</span></div><div class="value">${value}</div><small>${note}</small></div>`}
function invoicePaidAmounts() {
  const available = new Map();
  const paidByInvoice = new Map();
  for (const payment of data.payments) {
    available.set(payment.customer, (available.get(payment.customer) || 0) + payment.amount);
  }
  // Apply later payments to the oldest outstanding invoices first.
  const oldestFirst = [...data.sales].reverse().sort((a, b) => a.date.localeCompare(b.date));
  for (const sale of oldestFirst) {
    const remaining = Math.max(0, sale.total - sale.paid);
    const customerPayment = available.get(sale.customer) || 0;
    const applied = Math.min(remaining, customerPayment);
    paidByInvoice.set(sale.id, sale.paid + applied);
    available.set(sale.customer, customerPayment - applied);
  }
  return paidByInvoice;
}
function salesTable(rows) {
  if (!rows.length) return '<div class="empty">No sales yet. Record your first sale above.</div>';
  const paidAmounts = invoicePaidAmounts();
  return `<div class="tablewrap"><table><thead><tr><th>Invoice / date</th><th>Customer</th><th>Item</th><th>Amount</th><th>Payment</th></tr></thead><tbody>${rows.map(s => {
    const paid = paidAmounts.get(s.id) ?? s.paid;
    const settled = paid >= s.total;
    const status = settled ? 'Paid' : paid > 0 ? 'Part paid' : 'On credit';
    return `<tr><td><strong>${esc(s.id)}</strong><span class="sub">${esc(s.date)}</span></td><td>${esc(s.customer)}</td><td>${esc(s.product)}<span class="sub">${s.qty} ${esc(s.unit)}${s.qty > 1 ? 's' : ''}</span></td><td><strong>${money(s.total)}</strong></td><td><span class="badge ${settled ? '' : 'credit'}">${status}</span></td></tr>`;
  }).join('')}</tbody></table></div>`;
}
function render(){document.getElementById('nav').innerHTML=navs.map(([n,i])=>`<button class="${n===page?'active':''}" onclick="go('${n}')"><i>${i}</i>${n}</button>`).join('');document.getElementById('crumb').textContent=page;document.getElementById('date').textContent=new Date().toLocaleDateString('en-GB',{day:'numeric',month:'short',year:'numeric'});let today=data.sales.filter(s=>s.date===day()),low=data.products.filter(p=>p.stock<=p.min),due=Object.values(debts()).reduce((a,b)=>a+b,0);let descriptions={Overview:"Here's what's happening at your shop today.",Inventory:'Know what you have. Restock before you run out.',Sales:'Every sale, recorded and easy to find.',Purchases:'Keep incoming stock and supplier purchases in order.',Customers:'Track customer credit and collect outstanding balances.',Reports:'A simple view of how your business is doing.'};let html=`<div class="heading"><div><h1>${page==='Overview'?'Your shop, at a glance':page}</h1><p>${descriptions[page]}</p></div><div class="actions">${page==='Inventory'?'<button class="btn" onclick="productModal()">＋ Add product</button>':''}<button class="btn" onclick="transaction('purchase')">↙ Add purchase</button><button class="btn primary" onclick="transaction('sale')">＋ New sale</button></div></div>`;
if(page==='Overview'){html+=`<div class="welcome"><div><h2>A little more organized. A lot more in control.</h2><p>Try a sale or a purchase below. Your stock and balances update automatically.</p></div><div class="graphic">▥</div></div><div class="stats">${stat("Today's sales",money(sum(today,'total')),today.length+' invoices recorded today')}${stat('Stock value',money(data.products.reduce((a,p)=>a+p.stock*p.cost,0)),'At purchase cost · '+data.products.length+' products','▦')}${stat('Customer dues',money(due),'Outstanding across all customers','◷')}${stat('Low-stock items',low.length,'Products at or below reorder level','!')}</div><div class="grid"><section class="card"><div class="cardhead"><div><h2>Sales overview</h2><small>Daily sales · last 7 days</small></div><span class="badge">This week</span></div>${chart()}</section><section class="card"><div class="cardhead"><h2>Time to restock <span class="badge warn">${low.length}</span></h2><button class="link" onclick="go('Inventory')">View stock →</button></div>${low.slice(0,4).map(p=>`<div class="lowrow"><div class="producticon">${p.icon}</div><div class="name">${esc(p.name)}<span class="sub">Reorder at ${p.min} ${p.unit}s</span></div><span class="badge warn">${p.stock} left</span></div>`).join('')||'<div class="empty">All products are well stocked.</div>'}</section></div><section class="card"><div class="cardhead"><h2>Recent sales</h2><button class="link" onclick="go('Sales')">View all sales →</button></div>${salesTable(data.sales.slice(0,5))}</section>`}
if(page==='Inventory')html+=`<section class="card"><div class="cardhead"><h2>All products <span class="badge">${data.products.length}</span></h2><small>Quantities are in the listed selling unit</small></div><div class="toolbar"><input aria-label="Search products" placeholder="Search products…" oninput="filter=this.value;inventoryRows()"><select aria-label="Filter category" onchange="category=this.value;inventoryRows()"><option>All categories</option>${['Biscuits','Drinks','Confectionery','Grocery'].map(c=>`<option>${c}</option>`).join('')}</select></div><div id="inventoryRows"></div></section>`;
if(page==='Sales')html+=`<section class="card"><div class="cardhead"><h2>Sales history</h2><small>${data.sales.length} invoices · ${money(sum(data.sales,'total'))} total</small></div>${salesTable(data.sales)}</section>`;
if(page==='Purchases')html+=`<section class="card"><div class="cardhead"><h2>Purchase history</h2><small>All demo purchases are paid in full</small></div><div class="tablewrap"><table><thead><tr><th>Reference / date</th><th>Supplier</th><th>Product</th><th>Quantity</th><th>Total</th></tr></thead><tbody>${data.purchases.map(p=>`<tr><td><strong>${p.id}</strong><span class="sub">${p.date}</span></td><td>${esc(p.supplier)}</td><td>${esc(p.product)}</td><td>${p.qty} ${esc(p.unit)}s</td><td>${money(p.total)}</td></tr>`).join('')}</tbody></table></div></section>`;
if(page==='Customers'){let balances=debts();html+=`<div class="stats">${stat('Outstanding balance',money(due),'Total remaining to collect','◷')}${stat('Customers',Object.keys(balances).length,'Customers with recorded sales','♧')}</div><section class="card"><div class="cardhead"><h2>Customer balances</h2><small>Payments reduce the overall customer balance</small></div><div class="tablewrap"><table><thead><tr><th>Customer</th><th>Total purchases</th><th>Balance due</th><th>Action</th></tr></thead><tbody>${Object.entries(balances).map(([name,balance])=>`<tr><td><strong>${esc(name)}</strong></td><td>${money(sum(data.sales.filter(s=>s.customer===name),'total'))}</td><td class="${balance?'orange':'green'}">${money(balance)}</td><td>${balance>0?`<button class="btn collect" data-customer="${esc(name)}">Receive payment</button>`:'<span class="badge">Settled</span>'}</td></tr>`).join('')}</tbody></table></div></section><section class="card" style="margin-top:22px"><div class="cardhead"><h2>Payments received</h2></div>${data.payments.length?`<div class="tablewrap"><table><thead><tr><th>Date</th><th>Customer</th><th>Amount</th></tr></thead><tbody>${data.payments.map(p=>`<tr><td>${p.date}</td><td>${esc(p.customer)}</td><td>${money(p.amount)}</td></tr>`).join('')}</tbody></table></div>`:'<div class="empty">New customer payments will appear here.</div>'}</section>`}
if(page==='Reports')html+=`<div class="stats">${stat('Total sales',money(sum(data.sales,'total')),'All recorded invoices')}${stat('Gross profit',money(sum(data.sales,'total')-sum(data.sales,'cost')),'Sales less item cost · before expenses')}${stat('Cash collected',money(sum(data.sales,'paid')+sum(data.payments,'amount')),'At sale + later customer payments')}${stat('Purchases',money(sum(data.purchases,'total')),'All recorded purchases')}</div><section class="card"><div class="cardhead"><div><h2>Your demo data</h2><small>Export sales for a spreadsheet, or start the demo again.</small></div></div><div style="padding:0 22px 22px" class="actions"><button class="btn primary" onclick="exportSales()">↓ Export sales CSV</button><button class="btn" onclick="resetModal()">Reset demo data</button></div></section><p class="hint" style="margin-top:20px">Figures cover all saved transactions. Opening stock is sample inventory. Historical chart bars marked * are illustrative. Supplier credit, expenses, tax and returns are outside this demo.</p>`;
html+=`<footer><span>STOCKROOM · Wholesale, simplified.</span><span>Offline demo · saved in this browser</span></footer>`;document.getElementById('content').innerHTML=html;if(page==='Inventory'){
  document.querySelector('[aria-label="Search products"]').value=filter;
  document.querySelector('[aria-label="Filter category"]').value=category;
  inventoryRows();
}document.querySelectorAll('.collect').forEach(b=>b.onclick=()=>paymentModal(b.dataset.customer))}
function chart(){let vals=Array.from({length:7},(_,i)=>i<5?data.history[i]:sum(data.sales.filter(s=>s.date===day(i-6)),'total')),max=Math.max(...vals,1);return `<div class="chart">${vals.map((v,i)=>`<div class="barcol"><small>${(v/1000).toFixed(1)}k${i<5?'*':''}</small><div class="bar" style="height:${v/max*135}px" title="${money(v)}${i<5?' · illustrative sample':''}"></div></div>`).join('')}</div><div class="chartlabels">${vals.map((_,i)=>`<span>${i===6?'Today':new Date(day(i-6)+'T12:00:00').toLocaleDateString('en-GB',{weekday:'short'})}</span>`).join('')}</div><div class="hint" style="padding:0 22px;margin-top:-10px">* Illustrative history. Yesterday and today use recorded sales.</div>`}
function inventoryRows(){let rows=data.products.filter(p=>p.name.toLowerCase().includes(filter.toLowerCase())&&(category==='All categories'||p.category===category));document.getElementById('inventoryRows').innerHTML=`<div class="tablewrap"><table><thead><tr><th>Product</th><th>Category</th><th>Stock</th><th>Cost / unit</th><th>Sale / unit</th><th>Status</th></tr></thead><tbody>${rows.map(p=>`<tr><td><strong>${p.icon} ${esc(p.name)}</strong><span class="sub">SKU-${String(p.id).padStart(3,'0')} · per ${esc(p.unit)}</span></td><td>${p.category}</td><td><strong>${p.stock}</strong> ${esc(p.unit)}s</td><td>${money(p.cost)}</td><td>${money(p.price)}</td><td><span class="badge ${p.stock<=p.min?'warn':''}">${p.stock===0?'Out of stock':p.stock<=p.min?'Low stock':'In stock'}</span></td></tr>`).join('')}</tbody></table>${rows.length?'':'<div class="empty">No products match your search.</div>'}</div>`}
let modal=document.getElementById('modal');function openModal(title,body){modal.innerHTML=`<div class="modalhead"><h2>${title}</h2><button class="close" onclick="modal.close()" aria-label="Close">×</button></div>${body}`;modal.showModal()}
function transaction(type){let sale=type==='sale';openModal(sale?'Record a new sale':'Add a stock purchase',`<form id="tx"><p class="hint">${sale?'Choose a product and record payment. Stock updates when you save.':'Record received goods. Stock increases and the weighted average stock cost is updated.'}</p><label>${sale?'Customer':'Supplier'}<input name="party" required maxlength="80" placeholder="${sale?'e.g. Ahmed General Store':'e.g. United Distributors'}" list="parties"></label><datalist id="parties">${[...new Set(sale?data.sales.map(s=>s.customer):data.purchases.map(p=>p.supplier))].map(n=>`<option value="${esc(n)}">`).join('')}</datalist><label>Product<select name="product">${data.products.map(p=>`<option value="${p.id}">${esc(p.name)} · ${p.stock} ${esc(p.unit)}s available</option>`).join('')}</select></label><div class="row"><label>Quantity (selling units)<input name="qty" type="number" min="1" max="100000" step="1" value="1" required></label><label>${sale?'Selling price':'Purchase cost'} / unit (Rs)<input name="price" type="number" min="1" max="10000000" step="any" required></label></div>${sale?'<label>Payment<select name="payment"><option value="full">Paid in full</option><option value="partial">Part payment</option><option value="credit">On credit (pay later)</option></select></label><label id="paidLabel" hidden>Amount received (Rs)<input name="paid" type="number" min="0" step="1" value="0"></label>':''}<div class="total"><span>Total amount</span><strong id="txTotal"></strong></div><div class="error" id="txError" role="alert"></div><div class="actions"><button type="button" class="btn" onclick="modal.close()">Cancel</button><button class="btn primary" type="submit">${sale?'Save sale':'Save purchase'}</button></div></form>`);let f=document.getElementById('tx'),p=()=>data.products.find(p=>p.id===+f.elements.product.value),update=()=>{document.getElementById('txTotal').textContent=money(+f.elements.qty.value*+f.elements.price.value);if(sale)document.getElementById('paidLabel').hidden=f.elements.payment.value!=='partial'};f.elements.price.value=sale?p().price:p().cost;f.elements.product.onchange=()=>{f.elements.price.value=sale?p().price:p().cost;update()};f.oninput=update;update();f.onsubmit=e=>{e.preventDefault();let product=p(),qty=+f.elements.qty.value,price=+f.elements.price.value,total=qty*price,party=f.elements.party.value.trim(),paid=sale?(f.elements.payment.value==='full'?total:f.elements.payment.value==='credit'?0:+f.elements.paid.value):total;let error=!party?'Enter a customer or supplier name.':!Number.isInteger(qty)||qty<=0||!Number.isFinite(total)||price<=0?'Enter a valid quantity and price.':sale&&qty>product.stock?`Only ${product.stock} ${product.unit}s are available. Reduce the quantity or add a purchase.`:paid<0||paid>total||!Number.isFinite(paid)?'Payment must be between zero and the invoice total.':'';if(error){document.getElementById('txError').textContent=error;return}if(sale){product.stock-=qty;data.sales.unshift({id:'INV-'+(1001+data.sales.length),date:day(),customer:party,product:product.name,qty,unit:product.unit,total,cost:qty*product.cost,paid})}else{const existingValue=product.stock*product.cost;product.stock+=qty;product.cost=(existingValue+qty*price)/product.stock;data.purchases.unshift({id:'PUR-'+(1001+data.purchases.length),date:day(),supplier:party,product:product.name,qty,unit:product.unit,total})}const saved=save();modal.close();render();saveMessage(saved,sale?'Sale saved. Stock and customer balance updated.':'Purchase saved. Stock replenished.')}}
function productModal(){openModal('Add a product',`<form id="productForm"><label>Product name<input name="name" required maxlength="80" placeholder="e.g. LU Candi Biscuits"></label><div class="row"><label>Category<select name="category"><option>Biscuits</option><option>Drinks</option><option>Confectionery</option><option>Grocery</option></select></label><label>Selling unit<select name="unit"><option>carton</option><option>case</option><option>jar</option><option>pack</option><option>bag</option><option>piece</option></select></label></div><div class="row"><label>Opening stock<input name="stock" type="number" min="0" max="100000" step="1" value="0" required></label><label>Reorder level<input name="min" type="number" min="0" max="100000" step="1" value="10" required></label></div><div class="row"><label>Cost per unit (Rs)<input name="cost" type="number" min="1" max="10000000" step="1" required></label><label>Sale price per unit (Rs)<input name="price" type="number" min="1" max="10000000" step="any" required></label></div><div class="error" id="productError"></div><button class="btn primary">Add product</button></form>`);document.getElementById('productForm').onsubmit=e=>{e.preventDefault();let f=e.target.elements,name=f.name.value.trim();if(!name||data.products.some(p=>p.name.toLowerCase()===name.toLowerCase())){document.getElementById('productError').textContent='Enter a unique product name.';return}data.products.push({id:Math.max(...data.products.map(p=>p.id))+1,name,category:f.category.value,unit:f.unit.value,stock:+f.stock.value,min:+f.min.value,cost:+f.cost.value,price:+f.price.value,icon:({Biscuits:'🍪',Drinks:'🥤',Confectionery:'🍬',Grocery:'📦'})[f.category.value]});const saved=save();modal.close();render();saveMessage(saved,'Product added to inventory.')}}
function paymentModal(customer){let balance=debts()[customer];openModal('Receive customer payment',`<form id="payForm"><p>${esc(customer)}</p><div class="total"><span>Outstanding balance</span><strong>${money(balance)}</strong></div><label>Amount received (Rs)<input name="amount" type="number" min="1" max="${balance}" step="1" value="${balance}" required></label><button class="btn primary">Save payment</button></form>`);document.getElementById('payForm').onsubmit=e=>{e.preventDefault();let amount=+e.target.elements.amount.value;if(amount<=0||amount>debts()[customer])return;data.payments.unshift({customer,amount,date:day()});const saved=save();modal.close();render();saveMessage(saved,'Payment received. Customer balance updated.')}}
function exportSales(){let rows=[['Invoice','Date','Customer','Product','Quantity','Unit','Total (Rs)','Paid at sale (Rs)','Gross profit (Rs)'],...data.sales.map(s=>[s.id,s.date,s.customer,s.product,s.qty,s.unit,s.total,s.paid,s.total-s.cost])];let csv=rows.map(r=>r.map(v=>'"'+String(v).replace(/^[=+@-]/,"'$&").replace(/"/g,'""')+'"').join(',')).join('\r\n');let url=URL.createObjectURL(new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');a.href=url;a.download='stockroom-sales-'+day()+'.csv';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Sales CSV exported.')}
function resetModal(){openModal('Reset the demo?',`<form id="resetForm"><p style="margin-bottom:20px">This removes your demo changes and restores the original sample products, sales and balances.</p><div class="actions"><button class="btn" type="button" onclick="modal.close()">Keep my changes</button><button class="btn primary">Reset demo</button></div></form>`);document.getElementById('resetForm').onsubmit=e=>{e.preventDefault();data=seed();const saved=save();modal.close();render();saveMessage(saved,'Original demo data restored.')}}
render();
</script></body></html>
